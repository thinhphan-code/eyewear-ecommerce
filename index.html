  // =========================================================
  // 2. QUẢN LÝ WISHLIST & ĐÁNH GIÁ 5 SAO (LOCALSTORAGE)
  // =========================================================
  const WISHLIST_KEY = "eyewear_sv5_wishlist_v2";
  const REVIEWS_KEY = "eyewear_sv5_reviews_v2";

  let wishlist = JSON.parse(localStorage.getItem(WISHLIST_KEY) || "[]");
  let reviewsMap = JSON.parse(localStorage.getItem(REVIEWS_KEY) || "{}");
  let showOnlyWishlist = false;
  let activeProductId = null;
  let selectedStars = 5;

  if (Object.keys(reviewsMap).length === 0) {
    reviewsMap = {
      1: [{ author: "Phạm Phú", stars: 5, comment: "Gọng đeo nhẹ, form ôm mặt rất đẹp.", date: "2026-11-15" }],
      7: [{ author: "Hải Yến", stars: 5, comment: "Tròng sáng rõ, giá hợp lý cho sinh viên.", date: "2026-11-18" }]
    };
    localStorage.setItem(REVIEWS_KEY, JSON.stringify(reviewsMap));
  }

  function formatVND(value) {
    if (value == null) return "Liên hệ";
    return value.toLocaleString("vi-VN") + "₫";
  }

  function getRatingSummary(productId) {
    const list = reviewsMap[productId] || [];
    if (list.length === 0) return { avg: 0, count: 0, list: [] };
    const total = list.reduce((sum, r) => sum + r.stars, 0);
    return { avg: (total / list.length).toFixed(1), count: list.length, list };
  }

  function toggleWishlist(productId) {
    if (wishlist.includes(productId)) {
      wishlist = wishlist.filter(id => id !== productId);
    } else {
      wishlist.push(productId);
    }
    localStorage.setItem(WISHLIST_KEY, JSON.stringify(wishlist));
    renderProducts();
  }

  function handleImgError(imgEl, sku) {
    if (!imgEl.dataset.triedJpg) {
      imgEl.dataset.triedJpg = "1";
      imgEl.src = imgEl.src.replace(".webp", ".jpg");
      return;
    }
    imgEl.style.display = "none";
    imgEl.nextElementSibling.style.display = "block";
  }

  function renderProducts() {
    const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
    const cat = document.getElementById("categoryFilter").value;
    const grid = document.getElementById("productGrid");

    document.getElementById("wishlistCount").textContent = wishlist.length;
    const wlBtn = document.getElementById("wishlistFilterBtn");
    wlBtn.classList.toggle("active", showOnlyWishlist);

    const filtered = PRODUCTS.filter(p => {
      const matchKeyword =
        p.name.toLowerCase().includes(keyword) ||
        p.brand.toLowerCase().includes(keyword) ||
        p.sku.toLowerCase().includes(keyword);
      const matchCat = cat === "ALL" || p.category === cat;
      const matchWl = !showOnlyWishlist || wishlist.includes(p.id);
      return matchKeyword && matchCat && matchWl;
    });

    document.getElementById("visibleCount").textContent = filtered.length;

    if (filtered.length === 0) {
      grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; background:#fff; border-radius:12px;">
        Không tìm thấy sản phẩm phù hợp.
      </div>`;
      return;
    }

    grid.innerHTML = filtered.map(p => {
      const isLiked = wishlist.includes(p.id);
      const { avg, count } = getRatingSummary(p.id);
      const starDisplay = count > 0
        ? `<span class="stars-gold">★ ${avg}/5</span> (${count} đánh giá)`
        : `<span>Chưa có đánh giá</span>`;

      return `
        <div class="card">
          <div>
            <div class="thumb">
              ${p.discountPercent > 0 ? `<span class="discount-tag">-${p.discountPercent}%</span>` : ""}
              <img src="${p.image}" alt="${p.name}" onerror="handleImgError(this, '${p.sku}')" />
              <div class="thumb-fallback"><strong>${p.sku}</strong><br/>${p.brand} · ${p.category}</div>
              <button class="heart-btn" title="Lưu vào yêu thích" onclick="toggleWishlist(${p.id})">
                ${isLiked ? "❤️" : "🤍"}
              </button>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="badge">${p.category} · ${p.brand}</span>
              <span class="sku">${p.sku}</span>
            </div>
            <div class="title">${p.name}</div>
            <div class="desc">${p.description}</div>
            <div class="price-row">
              <span class="price">${formatVND(p.price)}</span>
              ${p.originalPrice ? `<span class="old-price">${formatVND(p.originalPrice)}</span>` : ""}
            </div>
            <div class="rating-summary">${starDisplay}</div>
          </div>
          <div class="card-actions">
            <button class="btn btn-outline" onclick="openReviewModal(${p.id})">
              ⭐ Đánh giá (5 sao)
            </button>
          </div>
        </div>
      `;
    }).join("");
  }

  function openReviewModal(productId) {
    activeProductId = productId;
    const product = PRODUCTS.find(p => p.id === productId);
    document.getElementById("modalProductSku").textContent = `${product.sku} · ${product.category} · ${product.brand}`;
    document.getElementById("modalProductTitle").textContent = product.name;
    document.getElementById("modalProductDesc").textContent = product.description;
    document.getElementById("modalProductPolicy").textContent = "Chính sách: " + product.policy;
    selectedStars = 5;
    updateStarPickerUI();
    renderModalReviews();
    document.getElementById("reviewModal").classList.add("open");
  }

  function closeReviewModal() {
    document.getElementById("reviewModal").classList.remove("open");
    activeProductId = null;
  }

  function updateStarPickerUI() {
    document.querySelectorAll("#starPicker span").forEach(el => {
      const val = Number(el.getAttribute("data-star"));
      el.classList.toggle("selected", val <= selectedStars);
    });
  }

  function renderModalReviews() {
    const { avg, count, list } = getRatingSummary(activeProductId);
    document.getElementById("modalRatingStats").textContent = count > 0
      ? `Điểm trung bình: ${avg}/5 sao (${count} lượt đánh giá)`
      : "Chưa có đánh giá nào. Hãy gửi đánh giá đầu tiên bên dưới!";

    const listEl = document.getElementById("reviewList");
    if (list.length === 0) {
      listEl.innerHTML = `<p style="color:#6b7280; font-size:13px;">Chưa có bình luận.</p>`;
      return;
    }

    listEl.innerHTML = list.map(r => `
      <div class="review-item">
        <div class="review-meta">
          <strong>${r.author}</strong> · <span class="stars-gold">${"★".repeat(r.stars)}${"☆".repeat(5 - r.stars)}</span> · ${r.date}
        </div>
        <div>${r.comment}</div>
      </div>
    `).join("");
  }

  document.querySelectorAll("#starPicker span").forEach(el => {
    el.addEventListener("click", () => {
      selectedStars = Number(el.getAttribute("data-star"));
      updateStarPickerUI();
    });
  });

  document.getElementById("reviewForm").addEventListener("submit", e => {
    e.preventDefault();
    if (!activeProductId) return;
    const author = document.getElementById("reviewerName").value.trim();
    const comment = document.getElementById("reviewComment").value.trim();
    if (!author || !comment) return;

    const current = reviewsMap[activeProductId] || [];
    reviewsMap[activeProductId] = [
      { author, stars: selectedStars, comment, date: new Date().toISOString().slice(0, 10) },
      ...current
    ];
    localStorage.setItem(REVIEWS_KEY, JSON.stringify(reviewsMap));

    document.getElementById("reviewerName").value = "";
    document.getElementById("reviewComment").value = "";
    renderModalReviews();
    renderProducts();
  });

  document.getElementById("searchInput").addEventListener("input", renderProducts);
  document.getElementById("categoryFilter").addEventListener("change", renderProducts);
  document.getElementById("wishlistFilterBtn").addEventListener("click", () => {
    showOnlyWishlist = !showOnlyWishlist;
    renderProducts();
  });

  renderProducts();
</script>
